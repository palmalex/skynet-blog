name: checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Runs on a GitHub-hosted runner
        run: |
          echo "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"

      - name: Secrets of the infrastructure repository are not readable
        env:
          # Names that exist in skynet-control-plane or on the pool; here they must resolve to empty.
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          GH_RUNNER_PAT: ${{ secrets.github_runner_pat }}
        run: |
          for v in SOPS_AGE_KEY OCI_PRIVATE_KEY GH_RUNNER_PAT; do
            if [ -n "${!v}" ]; then echo "::error::$v is set"; exit 1; fi
            echo "$v: empty (ok)"
          done

      - name: No credentials of the lab on the machine
        run: |
          for p in "$HOME/.oci" "$HOME/.config/sops" "$HOME/.ssh/id_ed25519"; do
            if [ -e "$p" ]; then echo "::error::$p exists"; exit 1; fi
            echo "$p: absent (ok)"
          done

      # Last, after the boundary tests: this runs the code of the pull request, with no secret in its environment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build and checks of the site (a broken page fails here, #758)
        run: ./build.sh check

      - name: HTML validity (Nu Html Checker; the known errors of the theme are filtered in build.sh)
        run: ./build.sh html

      # Advisory: a site that is down is not a reason to block a pull request, so this reports and never fails.
      - name: External links (advisory)
        run: ./build.sh links || echo "::warning::the external link check reported problems, see the log (not blocking)"
